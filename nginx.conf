# nginx.conf — tells Nginx how to serve our React app

// explain nginx.conf.
 This file configures Nginx to serve our React app and proxy API requests to the backend. 
 It listens on port 80, serves static files from /usr/share/nginx/html, enables gzip compression for faster loading, and uses a try_files directive to support client-side routing with React Router. Additionally, it proxies any requests starting with /api to the backend server running on http://backend:5000, allowing our frontend to communicate with the backend without CORS issues in production.
server {
    listen 80;

    # Where our React files live
    root /usr/share/nginx/html; // This tells Nginx that the root directory for serving files is /usr/share/nginx/html, which is where we copied our React app's build files in the Dockerfile. When a request comes in, Nginx will look for the requested file in this directory.
    index index.html; // This tells Nginx to serve index.html when the root URL is accessed.

    # Gzip compression — makes files smaller → faster loading
    gzip on; // This enables gzip compression in Nginx, which reduces the size of the files sent to the client, resulting in faster load times.
    gzip_types text/plain text/css application/json application/javascript; // This specifies the MIME types that should be compressed with gzip. It includes common types for web assets like CSS, JSON, and JavaScript files.

    # This is CRITICAL for React Router
    # Without it, refreshing /weather returns 404 (Nginx looks for a /weather file)
    # With it, ALL routes serve index.html and React handles routing
    location / {
        try_files $uri $uri/ /index.html; // explain with example. The try_files directive tells Nginx to first look for a file that matches the requested URI ($uri) and serve it if found. If it doesn't find a file, it then looks for a directory that matches the URI ($uri/). If neither a file nor a directory is found, it falls back to serving /index.html. This is crucial for React Router because when a user navigates to a route like /weather, there isn't an actual /weather file on the server. Without this configuration, Nginx would return a 404 error. With this setup, Nginx serves index.html for all routes, allowing React Router to handle the routing on the client side and display the correct page based on the URL.
    }
    # explain in easy terms. When a user visits our app, Nginx first checks if there is a file that matches the URL they requested. If they go to /weather, Nginx looks for a file named weather in the html folder. Since it does not exist, it then serves index.html instead. This allows our React app to take over and show the correct page based on the URL, even though there is not a physical file for each route.

    # Proxy API calls to the backend
    # Frontend calls /api/... → Nginx forwards to backend:5000/api/...
    # This avoids CORS issues in production
    location /api { 
        # This block tells Nginx how to handle requests that start with /api. When a request comes in that matches this pattern, Nginx will forward it to the backend server.
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}