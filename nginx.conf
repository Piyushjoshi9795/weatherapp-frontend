# nginx.conf — tells Nginx how to serve our React app
# This file configures Nginx to serve our React app and proxy API requests to the backend.
# It listens on port 80, serves static files from /usr/share/nginx/html, enables gzip compression 
# for faster loading, and uses a try_files directive to support client-side routing with React Router. 
# Additionally, it proxies any requests starting with /api to the backend server running on 
# http://backend:5000, allowing our frontend to communicate with the backend without CORS issues in production.

server {
    listen 80;

    # Where our React files live
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — makes files smaller → faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # This is CRITICAL for React Router
    # Without it, refreshing /weather returns 404 (Nginx looks for a /weather file)
    # With it, ALL routes serve index.html and React handles routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend
    # Frontend calls /api/... → Nginx forwards to backend:5000/api/...
    # This avoids CORS issues in production
    location /api { 
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}